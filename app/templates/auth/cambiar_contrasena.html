{% extends "base.html" %}
{% block title %}Cambiar contraseña · OrtoChika Web{% endblock %}
{% block content %}
<div class="card shadow p-4 mx-auto auth-card">
  <h4 class="mb-3">Cambiar contraseña</h4>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label for="actual" class="form-label">Contraseña actual</label>
      <input type="password" class="form-control" id="actual" name="actual" required>
    </div>
    <div class="mb-3">
      <label for="nueva" class="form-label">Nueva contraseña</label>
      <input type="password" class="form-control" id="nueva" name="nueva" minlength="8" maxlength="128" required>
      <div class="form-text">Mínimo 8 caracteres.</div>
    </div>
    <div class="mb-3">
      <label for="confirmar" class="form-label">Confirmar nueva contraseña</label>
      <input type="password" class="form-control" id="confirmar" name="confirmar" minlength="8" maxlength="128" required>
    </div>
    <button type="submit" class="btn btn-primary w-100 fw-bold">Guardar contraseña</button>
  </form>
</div>
{% endblock %}
